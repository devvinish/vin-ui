name: Release

# Publishes the CLI (@vinish/ui) to npm.
# Start it by pushing a tag like v0.2.0 (it must match packages/cli/package.json), or by hand.
#
# The site is not deployed from here: `npm run deploy` runs on the maintainer's machine, because it
# keeps the earlier /ui/_astro files the published WordPress pages use (workers/site/kept/).
#
# Repository secret needed:
#   NPM_TOKEN              an npm automation token that can publish @vinish/ui

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      npm:
        description: Publish the CLI to npm
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: test
    if: github.event_name == 'push' || inputs.npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches the CLI version
        if: github.event_name == 'push'
        run: |
          v=$(node -p "require('./packages/cli/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but packages/cli is $v"; exit 1; }
      - name: Publish @vinish/ui
        working-directory: packages/cli
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@vinish/ui@$v" version >/dev/null 2>&1; then echo "@vinish/ui@$v is already on npm"; exit 0; fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

