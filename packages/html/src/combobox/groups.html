<div class="vin-field" style="width: 100%; max-width: 320px">
  <label class="vin-label" for="cbx-tz">Time zone</label>
  <div class="vin-combobox" data-vin-combobox>
    <input id="cbx-tz" class="vin-input vin-combobox__input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cbx-tz-list" autocomplete="off" placeholder="Search…" value="London">
    <div class="vin-select__content vin-combobox__content" popover="manual">
      <div id="cbx-tz-list" role="listbox" aria-label="Time zone">
        <div class="vin-combobox__group" role="group" aria-labelledby="cbx-tz-g0">
          <div class="vin-combobox__label" id="cbx-tz-g0" role="presentation">Asia</div>
          <div class="vin-select__item" id="cbx-tz-opt-0" role="option" aria-selected="false" data-value="Asia/Kolkata">Kolkata</div>
          <div class="vin-select__item" id="cbx-tz-opt-1" role="option" aria-selected="false" data-value="Asia/Singapore">Singapore</div>
          <div class="vin-select__item" id="cbx-tz-opt-2" role="option" aria-selected="false" data-value="Asia/Tokyo">Tokyo</div>
        </div>
        <div class="vin-combobox__group" role="group" aria-labelledby="cbx-tz-g1">
          <div class="vin-combobox__label" id="cbx-tz-g1" role="presentation">Europe</div>
          <div class="vin-select__item" id="cbx-tz-opt-3" role="option" aria-selected="false" data-value="Europe/Berlin">Berlin</div>
          <div class="vin-select__item" id="cbx-tz-opt-4" role="option" aria-selected="true" data-value="Europe/London">London</div>
          <div class="vin-select__item" id="cbx-tz-opt-5" role="option" aria-selected="false" data-value="Europe/Paris">Paris</div>
        </div>
        <div class="vin-combobox__group" role="group" aria-labelledby="cbx-tz-g2">
          <div class="vin-combobox__label" id="cbx-tz-g2" role="presentation">Americas</div>
          <div class="vin-select__item" id="cbx-tz-opt-6" role="option" aria-selected="false" data-value="America/New_York">New York</div>
          <div class="vin-select__item" id="cbx-tz-opt-7" role="option" aria-selected="false" data-value="America/Sao_Paulo">São Paulo</div>
          <div class="vin-select__item" id="cbx-tz-opt-8" role="option" aria-selected="false" data-value="America/Los_Angeles">Los Angeles</div>
        </div>
      </div>
      <p class="vin-combobox__empty" role="status" hidden>No time zones found.</p>
    </div>
    <input type="hidden" name="timezone" value="Europe/London">
  </div>
</div>
