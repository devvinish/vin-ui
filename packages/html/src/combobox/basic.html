<div class="vin-field" style="width: 100%; max-width: 320px">
  <label class="vin-label" for="cbx-fw">Framework</label>

    <input id="cbx-fw" class="vin-input vin-combobox__input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="cbx-fw-list" autocomplete="off" placeholder="Search frameworks…">
    <div class="vin-select__content vin-combobox__content" popover="manual">
      <div id="cbx-fw-list" role="listbox" aria-label="Framework">
        <div class="vin-select__item" id="cbx-fw-opt-0" role="option" aria-selected="false" data-value="astro">Astro</div>

        <div class="vin-select__item" id="cbx-fw-opt-2" role="option" aria-selected="false" data-value="next">Next.js</div>
        <div class="vin-select__item" id="cbx-fw-opt-3" role="option" aria-selected="false" data-value="nuxt">Nuxt</div>
        <div class="vin-select__item" id="cbx-fw-opt-4" role="option" aria-selected="false" data-value="remix">Remix</div>
        <div class="vin-select__item" id="cbx-fw-opt-5" role="option" aria-selected="false" data-value="solid">SolidStart</div>
        <div class="vin-select__item" id="cbx-fw-opt-6" role="option" aria-selected="false" data-value="sveltekit">SvelteKit</div>
      </div>
      <p class="vin-combobox__empty" role="status" hidden>No results.</p>
    </div>
    <input type="hidden" name="framework" value="">

</div>
