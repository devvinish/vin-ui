<div class="vin-field">
  <label class="vin-label" for="otp">Verification code</label>
  <div class="vin-otp" data-vin-otp>
    <input id="otp" class="vin-otp__input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" aria-describedby="otp-hint">
    <div class="vin-otp__slots" aria-hidden="true">
      <span class="vin-input vin-otp__slot"></span><span class="vin-input vin-otp__slot"></span><span class="vin-input vin-otp__slot"></span>
      <span class="vin-otp__sep"></span>
      <span class="vin-input vin-otp__slot"></span><span class="vin-input vin-otp__slot"></span><span class="vin-input vin-otp__slot"></span>
    </div>
  </div>
  <p class="vin-hint" id="otp-hint">Sent by SMS to the number ending 4321.</p>
</div>
