<form class="vin-questionnaire" data-state="submitted" aria-label="Trip length" style="max-width: 440px">
  <fieldset class="vin-questionnaire__question" disabled>
    <legend class="vin-questionnaire__prompt">How long do you want to hike?</legend>
    <div class="vin-choice">
      <input type="radio" class="vin-radio" id="qs-len-0" name="qs-len" value="short">
      <div class="vin-choice__body"><label class="vin-choice__label" for="qs-len-0">Under 2 hours</label></div>
    </div>
    <div class="vin-choice">
      <input type="radio" class="vin-radio" id="qs-len-1" name="qs-len" value="half-day" checked>
      <div class="vin-choice__body"><label class="vin-choice__label" for="qs-len-1">Half a day</label></div>
    </div>
    <div class="vin-choice">
      <input type="radio" class="vin-radio" id="qs-len-2" name="qs-len" value="full-day">
      <div class="vin-choice__body"><label class="vin-choice__label" for="qs-len-2">A full day</label></div>
    </div>
  </fieldset>
  <p class="vin-questionnaire__status" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Answer sent</p>
</form>
