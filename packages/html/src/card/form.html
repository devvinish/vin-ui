<div class="vin-card" style="width: 100%; max-width: 360px">
  <div class="vin-card__header">
    <h3 class="vin-card__title">New project</h3>
    <p class="vin-card__desc">You can change these later.</p>
  </div>
  <div class="vin-card__body">
    <div class="vin-field">
      <label class="vin-label" for="project-name">Project name</label>
      <input id="project-name" class="vin-input" placeholder="My app">
    </div>
  </div>
  <div class="vin-card__footer">
    <button type="button" class="vin-btn">Create</button>
    <button type="button" class="vin-btn vin-btn--outline">Cancel</button>
  </div>
</div>
