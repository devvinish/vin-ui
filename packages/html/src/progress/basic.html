<div style="display: grid; gap: 20px; width: 100%; max-width: 320px">
  <div class="vin-field">
    <div class="vin-progress__head">
      <span class="vin-label" id="upload-label">Uploading design.fig</span>
      <span class="vin-progress__value">64%</span>
    </div>
    <div class="vin-progress" role="progressbar" aria-labelledby="upload-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64" style="--vin-value: 64%"></div>
  </div>
  <div class="vin-field">
    <div class="vin-progress__head">
      <span class="vin-label" id="backup-label">Backup complete</span>
      <span class="vin-progress__value">100%</span>
    </div>
    <div class="vin-progress vin-progress--success" role="progressbar" aria-labelledby="backup-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="--vin-value: 100%"></div>
  </div>
</div>
