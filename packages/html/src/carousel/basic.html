<section class="vin-carousel" aria-roledescription="carousel" aria-label="Getting started" data-vin-carousel style="max-width: 520px">
  <div class="vin-carousel__track" id="tour-slides" tabindex="0" aria-live="polite">
    <div class="vin-carousel__slide" role="group" aria-roledescription="slide" aria-label="1 of 4">
      <div style="display: grid; align-content: end; gap: 6px; min-height: 200px; padding: 28px; border-radius: var(--vin-radius-lg); background: color-mix(in srgb, var(--vin-accent) 13%, transparent)">
        <h3 class="vin-h3" style="margin: 0">Pick a style</h3>
        <p class="vin-p" style="margin: 0">Eight looks, one set of components.</p>
      </div>
    </div>
    <div class="vin-carousel__slide" role="group" aria-roledescription="slide" aria-label="2 of 4">
      <div style="display: grid; align-content: end; gap: 6px; min-height: 200px; padding: 28px; border-radius: var(--vin-radius-lg); background: color-mix(in srgb, var(--vin-accent) 13%, transparent)">
        <h3 class="vin-h3" style="margin: 0">Choose an accent</h3>
        <p class="vin-p" style="margin: 0">Any colour. Text on it stays readable.</p>
      </div>
    </div>
    <div class="vin-carousel__slide" role="group" aria-roledescription="slide" aria-label="3 of 4">
      <div style="display: grid; align-content: end; gap: 6px; min-height: 200px; padding: 28px; border-radius: var(--vin-radius-lg); background: color-mix(in srgb, var(--vin-accent) 13%, transparent)">
        <h3 class="vin-h3" style="margin: 0">Copy the code</h3>
        <p class="vin-p" style="margin: 0">Plain HTML or React. No build step needed.</p>
      </div>
    </div>
    <div class="vin-carousel__slide" role="group" aria-roledescription="slide" aria-label="4 of 4">
      <div style="display: grid; align-content: end; gap: 6px; min-height: 200px; padding: 28px; border-radius: var(--vin-radius-lg); background: color-mix(in srgb, var(--vin-accent) 13%, transparent)">
        <h3 class="vin-h3" style="margin: 0">Ship it</h3>
        <p class="vin-p" style="margin: 0">Light, dark and accessible out of the box.</p>
      </div>
    </div>
  </div>
  <div class="vin-carousel__controls">
    <button type="button" class="vin-btn vin-btn--outline vin-btn--icon vin-carousel__prev" aria-controls="tour-slides" aria-label="Previous slide" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="vin-carousel__dots" role="group" aria-label="Choose a slide">
      <button type="button" class="vin-carousel__dot" aria-controls="tour-slides" aria-label="Slide 1" aria-current="true"></button>
      <button type="button" class="vin-carousel__dot" aria-controls="tour-slides" aria-label="Slide 2"></button>
      <button type="button" class="vin-carousel__dot" aria-controls="tour-slides" aria-label="Slide 3"></button>
      <button type="button" class="vin-carousel__dot" aria-controls="tour-slides" aria-label="Slide 4"></button>
    </div>
    <button type="button" class="vin-btn vin-btn--outline vin-btn--icon vin-carousel__next" aria-controls="tour-slides" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>
</section>
