<button type="button" class="vin-btn vin-btn--outline" commandfor="drawer-photo" command="show-modal">Photo options</button>
<dialog class="vin-dialog vin-sheet vin-drawer" id="drawer-photo" data-side="bottom" aria-labelledby="drawer-photo-title" closedby="any" data-vin-drawer>
  <div class="vin-dialog__header">
    <h2 class="vin-dialog__title" id="drawer-photo-title">Sunset over the bay.jpg</h2>
  </div>
  <div class="vin-dialog__body">
    <button type="button" class="vin-btn vin-btn--ghost" commandfor="drawer-photo" command="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>Save to device</button>
    <button type="button" class="vin-btn vin-btn--ghost" commandfor="drawer-photo" command="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Copy link</button>
    <button type="button" class="vin-btn vin-btn--ghost" commandfor="drawer-photo" command="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>Report a problem</button>
  </div>
  <button type="button" class="vin-btn vin-btn--ghost vin-btn--icon vin-dialog__close" commandfor="drawer-photo" command="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</dialog>
