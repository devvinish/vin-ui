<div class="vin-menubar" role="menubar" aria-label="Editor" data-vin-menubar>
  <button type="button" class="vin-menubar__trigger" id="mb-file" role="menuitem" aria-haspopup="menu" aria-expanded="false" popovertarget="mb-file-menu" tabindex="0">File</button>
  <div class="vin-menu" id="mb-file-menu" popover role="menu" aria-labelledby="mb-file">
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">New tab <span class="vin-menu__shortcut" aria-hidden="true">⌘T</span></button>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">New window <span class="vin-menu__shortcut" aria-hidden="true">⌘N</span></button>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1" disabled>New incognito window</button>
    <div class="vin-menu__separator" role="separator"></div>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Print… <span class="vin-menu__shortcut" aria-hidden="true">⌘P</span></button>
  </div>
  <button type="button" class="vin-menubar__trigger" id="mb-edit" role="menuitem" aria-haspopup="menu" aria-expanded="false" popovertarget="mb-edit-menu" tabindex="-1">Edit</button>
  <div class="vin-menu" id="mb-edit-menu" popover role="menu" aria-labelledby="mb-edit">
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Undo <span class="vin-menu__shortcut" aria-hidden="true">⌘Z</span></button>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Redo <span class="vin-menu__shortcut" aria-hidden="true">⇧⌘Z</span></button>
    <div class="vin-menu__separator" role="separator"></div>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Cut</button>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Copy</button>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Paste</button>
  </div>
  <button type="button" class="vin-menubar__trigger" id="mb-view" role="menuitem" aria-haspopup="menu" aria-expanded="false" popovertarget="mb-view-menu" tabindex="-1">View</button>
  <div class="vin-menu" id="mb-view-menu" popover role="menu" aria-labelledby="mb-view">
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Zoom in <span class="vin-menu__shortcut" aria-hidden="true">⌘+</span></button>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Zoom out <span class="vin-menu__shortcut" aria-hidden="true">⌘−</span></button>
    <div class="vin-menu__separator" role="separator"></div>
    <button type="button" class="vin-menu__item" role="menuitem" tabindex="-1">Full screen</button>
  </div>
</div>
