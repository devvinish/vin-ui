<div style="display: grid; gap: 18px; width: 100%; max-width: 380px">
  <div class="vin-choice vin-choice--end">
    <input id="s-marketing" class="vin-switch" type="checkbox" role="switch" aria-describedby="s-marketing-desc">
    <div class="vin-choice__body">
      <label class="vin-choice__label" for="s-marketing">Marketing emails</label>
      <p class="vin-choice__desc" id="s-marketing-desc">News, offers and product updates.</p>
    </div>
  </div>
  <div class="vin-choice vin-choice--end">
    <input id="s-security" class="vin-switch" type="checkbox" role="switch" checked aria-describedby="s-security-desc">
    <div class="vin-choice__body">
      <label class="vin-choice__label" for="s-security">Security alerts</label>
      <p class="vin-choice__desc" id="s-security-desc">Sign-ins from new devices.</p>
    </div>
  </div>
</div>
