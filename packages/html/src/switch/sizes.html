<div style="display: grid; gap: 14px">
  <div class="vin-choice">
    <input id="compact" class="vin-switch vin-switch--sm" type="checkbox" role="switch" checked>
    <div class="vin-choice__body"><label class="vin-choice__label" for="compact">Compact view</label></div>
  </div>
  <div class="vin-choice">
    <input id="beta" class="vin-switch" type="checkbox" role="switch" checked disabled>
    <div class="vin-choice__body"><label class="vin-choice__label" for="beta">Beta features (managed)</label></div>
  </div>
  <div class="vin-choice">
    <input id="sync" class="vin-switch" type="checkbox" role="switch" disabled>
    <div class="vin-choice__body"><label class="vin-choice__label" for="sync">Offline sync</label></div>
  </div>
</div>
