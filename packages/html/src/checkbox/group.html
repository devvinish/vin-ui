<fieldset style="display: grid; gap: 10px; margin: 0; padding: 0; border: 0; min-width: 0">
  <legend class="vin-label" style="padding: 0; margin-bottom: 10px">Notify me about</legend>
  <div class="vin-choice">
    <input id="n-comments" class="vin-checkbox" type="checkbox" checked>
    <div class="vin-choice__body"><label class="vin-choice__label" for="n-comments">Comments</label></div>
  </div>
  <div class="vin-choice">
    <input id="n-mentions" class="vin-checkbox" type="checkbox" checked>
    <div class="vin-choice__body"><label class="vin-choice__label" for="n-mentions">Mentions</label></div>
  </div>
  <div class="vin-choice">
    <input id="n-releases" class="vin-checkbox" type="checkbox">
    <div class="vin-choice__body"><label class="vin-choice__label" for="n-releases">New releases</label></div>
  </div>
  <div class="vin-choice">
    <input id="n-billing" class="vin-checkbox" type="checkbox" checked disabled>
    <div class="vin-choice__body"><label class="vin-choice__label" for="n-billing">Billing (always on)</label></div>
  </div>
</fieldset>
