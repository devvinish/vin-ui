<div style="display: grid; gap: 20px; width: 100%; max-width: 320px">
  <div class="vin-field">
    <div class="vin-slider__head">
      <label class="vin-label" for="brightness">Brightness</label>
      <output class="vin-slider__value" for="brightness" data-format="{value}%">70%</output>
    </div>
    <input id="brightness" class="vin-slider" type="range" min="0" max="100" step="10" value="70" style="--vin-fill: 70%" data-vin-slider>
  </div>
  <div class="vin-field">
    <div class="vin-slider__head">
      <label class="vin-label" for="bass">Bass (locked)</label>
    </div>
    <input id="bass" class="vin-slider" type="range" min="0" max="100" value="30" style="--vin-fill: 30%" disabled data-vin-slider>
  </div>
</div>
