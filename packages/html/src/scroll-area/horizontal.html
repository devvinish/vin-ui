<div class="vin-scroll-area vin-scroll-area--horizontal" role="region" aria-label="Playlists" tabindex="0" style="width: 100%; max-width: 400px">
  <div style="display: flex; gap: 12px; width: max-content; padding: 16px">
    <figure style="margin: 0; width: 120px">
      <div style="aspect-ratio: 1; border-radius: var(--vin-radius); background: linear-gradient(135deg, var(--vin-accent), color-mix(in srgb, var(--vin-accent) 35%, var(--vin-surface)))"></div>
      <figcaption style="margin-top: 8px">Morning focus<br><span style="color: var(--vin-muted)">24 tracks</span></figcaption>
    </figure>
    <figure style="margin: 0; width: 120px">
      <div style="aspect-ratio: 1; border-radius: var(--vin-radius); background: linear-gradient(200deg, color-mix(in srgb, var(--vin-accent) 70%, var(--vin-fg)), color-mix(in srgb, var(--vin-accent) 45%, var(--vin-surface)))"></div>
      <figcaption style="margin-top: 8px">Deep work<br><span style="color: var(--vin-muted)">18 tracks</span></figcaption>
    </figure>
    <figure style="margin: 0; width: 120px">
      <div style="aspect-ratio: 1; border-radius: var(--vin-radius); background: linear-gradient(45deg, color-mix(in srgb, var(--vin-accent) 25%, var(--vin-surface)), var(--vin-accent))"></div>
      <figcaption style="margin-top: 8px">Late night<br><span style="color: var(--vin-muted)">31 tracks</span></figcaption>
    </figure>
    <figure style="margin: 0; width: 120px">
      <div style="aspect-ratio: 1; border-radius: var(--vin-radius); background: linear-gradient(160deg, color-mix(in srgb, var(--vin-accent) 55%, var(--vin-surface)), color-mix(in srgb, var(--vin-accent) 80%, var(--vin-fg)))"></div>
      <figcaption style="margin-top: 8px">Road trip<br><span style="color: var(--vin-muted)">42 tracks</span></figcaption>
    </figure>
    <figure style="margin: 0; width: 120px">
      <div style="aspect-ratio: 1; border-radius: var(--vin-radius); background: linear-gradient(90deg, var(--vin-accent), color-mix(in srgb, var(--vin-accent) 20%, var(--vin-surface)))"></div>
      <figcaption style="margin-top: 8px">Sunday<br><span style="color: var(--vin-muted)">15 tracks</span></figcaption>
    </figure>
  </div>
</div>
