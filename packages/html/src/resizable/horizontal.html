<div class="vin-resizable" style="width: 100%; max-width: 520px; height: 200px" data-vin-resizable>
  <div class="vin-resizable__panel" id="rz-sidebar" style="--vin-size: 30" data-min="20">
    <div style="padding: 16px">
      <p style="margin: 0 0 8px; font-weight: 600">Mailboxes</p>
      <p style="margin: 0; color: var(--vin-muted)">Inbox<br>Drafts<br>Sent<br>Archive</p>
    </div>
  </div>
  <div class="vin-resizable__handle vin-resizable__handle--grip" role="separator" tabindex="0" aria-label="Resize mailboxes" aria-controls="rz-sidebar" aria-orientation="vertical" aria-valuenow="30" aria-valuemin="20" aria-valuemax="70"></div>
  <div class="vin-resizable__panel" style="--vin-size: 70" data-min="30">
    <div style="padding: 16px">
      <p style="margin: 0 0 8px; font-weight: 600">Inbox</p>
      <p style="margin: 0; color: var(--vin-muted)">Drag the handle to give the list more room, or Tab to it and use the arrow keys.</p>
    </div>
  </div>
</div>
