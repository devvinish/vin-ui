<div class="vin-resizable" style="width: 100%; max-width: 560px; height: 260px" data-vin-resizable>
  <div class="vin-resizable__panel" id="rz-files" style="--vin-size: 25" data-min="15">
    <div style="padding: 16px; font-weight: 600">Files</div>
  </div>
  <div class="vin-resizable__handle" role="separator" tabindex="0" aria-label="Resize files" aria-controls="rz-files" aria-orientation="vertical" aria-valuenow="25" aria-valuemin="15" aria-valuemax="70"></div>
  <div class="vin-resizable__panel" style="--vin-size: 75" data-min="30">
    <div class="vin-resizable vin-resizable--vertical" data-vin-resizable>
      <div class="vin-resizable__panel" id="rz-preview" style="--vin-size: 65" data-min="20">
        <div style="padding: 16px; font-weight: 600">Preview</div>
      </div>
      <div class="vin-resizable__handle" role="separator" tabindex="0" aria-label="Resize preview" aria-controls="rz-preview" aria-orientation="horizontal" aria-valuenow="65" aria-valuemin="20" aria-valuemax="80"></div>
      <div class="vin-resizable__panel" style="--vin-size: 35" data-min="20">
        <div style="padding: 16px; font-weight: 600">Console</div>
      </div>
    </div>
  </div>
</div>
