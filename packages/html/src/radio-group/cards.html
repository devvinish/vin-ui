<fieldset class="vin-radio-group vin-radio-group--cards" style="width: 100%; max-width: 360px">
  <legend class="vin-radio-group__legend">Plan</legend>
  <div class="vin-choice">
    <input id="plan-hobby" class="vin-radio" type="radio" name="plan" value="hobby" aria-describedby="plan-hobby-desc">
    <div class="vin-choice__body">
      <label class="vin-choice__label" for="plan-hobby">Hobby</label>
      <p class="vin-choice__desc" id="plan-hobby-desc">Free for personal projects.</p>
    </div>
  </div>
  <div class="vin-choice">
    <input id="plan-pro" class="vin-radio" type="radio" name="plan" value="pro" checked aria-describedby="plan-pro-desc">
    <div class="vin-choice__body">
      <label class="vin-choice__label" for="plan-pro">Pro</label>
      <p class="vin-choice__desc" id="plan-pro-desc">For small teams, billed monthly.</p>
    </div>
  </div>
  <div class="vin-choice">
    <input id="plan-enterprise" class="vin-radio" type="radio" name="plan" value="enterprise" aria-describedby="plan-enterprise-desc">
    <div class="vin-choice__body">
      <label class="vin-choice__label" for="plan-enterprise">Enterprise</label>
      <p class="vin-choice__desc" id="plan-enterprise-desc">Single sign-on and priority support.</p>
    </div>
  </div>
</fieldset>
