<fieldset class="vin-radio-group">
  <legend class="vin-radio-group__legend">Email me</legend>
  <div class="vin-choice">
    <input id="freq-instant" class="vin-radio" type="radio" name="frequency" value="instant">
    <div class="vin-choice__body"><label class="vin-choice__label" for="freq-instant">Instantly</label></div>
  </div>
  <div class="vin-choice">
    <input id="freq-daily" class="vin-radio" type="radio" name="frequency" value="daily" checked>
    <div class="vin-choice__body"><label class="vin-choice__label" for="freq-daily">Once a day</label></div>
  </div>
  <div class="vin-choice">
    <input id="freq-weekly" class="vin-radio" type="radio" name="frequency" value="weekly">
    <div class="vin-choice__body"><label class="vin-choice__label" for="freq-weekly">Once a week</label></div>
  </div>
  <div class="vin-choice">
    <input id="freq-never" class="vin-radio" type="radio" name="frequency" value="never">
    <div class="vin-choice__body"><label class="vin-choice__label" for="freq-never">Never</label></div>
  </div>
</fieldset>
