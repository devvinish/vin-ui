<fieldset class="vin-radio-group vin-radio-group--horizontal">
  <legend class="vin-radio-group__legend">Size</legend>
  <div class="vin-choice">
    <input id="size-s" class="vin-radio" type="radio" name="size" value="s">
    <div class="vin-choice__body"><label class="vin-choice__label" for="size-s">S</label></div>
  </div>
  <div class="vin-choice">
    <input id="size-m" class="vin-radio" type="radio" name="size" value="m" checked>
    <div class="vin-choice__body"><label class="vin-choice__label" for="size-m">M</label></div>
  </div>
  <div class="vin-choice">
    <input id="size-l" class="vin-radio" type="radio" name="size" value="l">
    <div class="vin-choice__body"><label class="vin-choice__label" for="size-l">L</label></div>
  </div>
  <div class="vin-choice">
    <input id="size-xl" class="vin-radio" type="radio" name="size" value="xl" disabled>
    <div class="vin-choice__body"><label class="vin-choice__label" for="size-xl">XL (sold out)</label></div>
  </div>
</fieldset>
