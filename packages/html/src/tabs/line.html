<div class="vin-tabs vin-tabs--line" data-vin-tabs style="width: 100%; max-width: 420px">
  <div class="vin-tabs__list" role="tablist" aria-label="Project">
    <button type="button" class="vin-tabs__tab" role="tab" id="tb-overview" aria-selected="true" aria-controls="tb-overview-panel">Overview</button>
    <button type="button" class="vin-tabs__tab" role="tab" id="tb-activity" aria-selected="false" aria-controls="tb-activity-panel" tabindex="-1">Activity</button>
    <button type="button" class="vin-tabs__tab" role="tab" id="tb-files" aria-selected="false" aria-controls="tb-files-panel" tabindex="-1">Files</button>
    <button type="button" class="vin-tabs__tab" role="tab" id="tb-archive" aria-selected="false" aria-controls="tb-archive-panel" tabindex="-1" disabled>Archive</button>
  </div>
  <div class="vin-tabs__panel" role="tabpanel" id="tb-overview-panel" aria-labelledby="tb-overview" tabindex="0">12 open tasks, 3 due this week.</div>
  <div class="vin-tabs__panel" role="tabpanel" id="tb-activity-panel" aria-labelledby="tb-activity" tabindex="0" hidden>Latest changes from your team.</div>
  <div class="vin-tabs__panel" role="tabpanel" id="tb-files-panel" aria-labelledby="tb-files" tabindex="0" hidden>Shared documents and images.</div>
  <div class="vin-tabs__panel" role="tabpanel" id="tb-archive-panel" aria-labelledby="tb-archive" tabindex="0" hidden>Archived items.</div>
</div>
