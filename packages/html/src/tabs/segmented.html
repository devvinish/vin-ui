<div class="vin-tabs" data-vin-tabs style="width: 100%; max-width: 380px">
  <div class="vin-tabs__list" role="tablist" aria-label="Account settings">
    <button type="button" class="vin-tabs__tab" role="tab" id="ta-account" aria-selected="true" aria-controls="ta-account-panel">Account</button>
    <button type="button" class="vin-tabs__tab" role="tab" id="ta-password" aria-selected="false" aria-controls="ta-password-panel" tabindex="-1">Password</button>
    <button type="button" class="vin-tabs__tab" role="tab" id="ta-team" aria-selected="false" aria-controls="ta-team-panel" tabindex="-1">Team</button>
  </div>
  <div class="vin-tabs__panel" role="tabpanel" id="ta-account-panel" aria-labelledby="ta-account" tabindex="0">Change your name, email and profile picture.</div>
  <div class="vin-tabs__panel" role="tabpanel" id="ta-password-panel" aria-labelledby="ta-password" tabindex="0" hidden>Update your password and turn on two-step sign-in.</div>
  <div class="vin-tabs__panel" role="tabpanel" id="ta-team-panel" aria-labelledby="ta-team" tabindex="0" hidden>Invite people and manage their roles.</div>
</div>
