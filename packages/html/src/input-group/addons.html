<div style="display: grid; gap: 16px; width: 100%; max-width: 320px">
  <div class="vin-field">
    <label class="vin-label" for="site">Website</label>
    <div class="vin-input vin-input-group">
      <span class="vin-input-group__addon">https://</span>
      <input id="site" class="vin-input-group__input" placeholder="example.com">
    </div>
  </div>
  <div class="vin-field">
    <label class="vin-label" for="price">Price (INR)</label>
    <div class="vin-input vin-input-group">
      <span class="vin-input-group__addon">₹</span>
      <input id="price" class="vin-input-group__input" inputmode="decimal" value="1,499">
      <span class="vin-input-group__addon">per month</span>
    </div>
  </div>
</div>
