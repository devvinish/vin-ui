<details class="vin-collapsible" style="width: 100%; max-width: 360px" open>
  <summary class="vin-collapsible__trigger">Advanced settings</summary>
  <div class="vin-collapsible__content" style="display: grid; gap: 12px">
    <div class="vin-field">
      <label class="vin-label" for="col-timeout">Timeout (seconds)</label>
      <input id="col-timeout" class="vin-input" type="number" value="30">
    </div>
    <div class="vin-choice">
      <input id="col-retry" class="vin-checkbox" type="checkbox" checked>
      <div class="vin-choice__body">
        <label class="vin-choice__label" for="col-retry">Retry failed requests</label>
      </div>
    </div>
  </div>
</details>
