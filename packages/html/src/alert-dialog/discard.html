<button type="button" class="vin-btn vin-btn--outline" commandfor="adlg-discard" command="show-modal">Close editor</button>
<dialog class="vin-dialog vin-alert-dialog" id="adlg-discard" role="alertdialog" aria-labelledby="adlg-discard-title" aria-describedby="adlg-discard-desc">
  <div class="vin-dialog__header">
    <h2 class="vin-dialog__title" id="adlg-discard-title">Discard your changes?</h2>
    <p class="vin-dialog__description" id="adlg-discard-desc">You have edits that aren't saved yet.</p>
  </div>
  <form method="dialog" class="vin-dialog__footer">
    <button type="submit" class="vin-btn vin-btn--outline" value="cancel" autofocus>Keep editing</button>
    <button type="submit" class="vin-btn" value="discard">Discard</button>
  </form>
</dialog>
