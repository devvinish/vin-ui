<button type="button" class="vin-btn" commandfor="dlg-done" command="show-modal">Publish</button>
<dialog class="vin-dialog" id="dlg-done" aria-labelledby="dlg-done-title" aria-describedby="dlg-done-desc" closedby="any">
  <div class="vin-dialog__header">
    <h2 class="vin-dialog__title" id="dlg-done-title">Your site is live</h2>
    <p class="vin-dialog__description" id="dlg-done-desc">Anyone with the link can see it now. It can take a minute to show up everywhere.</p>
  </div>
  <div class="vin-dialog__footer">
    <button type="button" class="vin-btn" commandfor="dlg-done" command="close">Got it</button>
  </div>
  <button type="button" class="vin-btn vin-btn--ghost vin-btn--icon vin-dialog__close" commandfor="dlg-done" command="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
</dialog>
