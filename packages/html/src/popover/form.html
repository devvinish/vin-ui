<button type="button" class="vin-btn vin-btn--outline" popovertarget="pop-size">Dimensions</button>
<div class="vin-popover" id="pop-size" popover role="dialog" aria-labelledby="pop-size-title" data-vin-popover style="width: 260px">
  <p class="vin-popover__title" id="pop-size-title">Dimensions</p>
  <p class="vin-popover__description">Set the size of the layer.</p>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
    <div class="vin-field">
      <label class="vin-label" for="pop-w">Width</label>
      <input id="pop-w" class="vin-input vin-input--sm" value="1200">
    </div>
    <div class="vin-field">
      <label class="vin-label" for="pop-h">Height</label>
      <input id="pop-h" class="vin-input vin-input--sm" value="800">
    </div>
  </div>
</div>
