<section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
  <div class="vin-card">
    <div class="vin-card__body" style="display: grid; gap: 8px; padding-bottom: 4px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <p class="vin-small" style="margin: 0; color: var(--vin-muted)">Total revenue</p>
        <span class="vin-badge vin-badge--success">+12.5%</span>
      </div>
      <p style="margin: 0; font-size: 30px; font-weight: var(--vin-title-weight); line-height: 1.1">₹4,52,310</p>
      <p class="vin-small" style="margin: 0; color: var(--vin-muted)">Up from ₹4,02,050 last month</p>
    </div>
  </div>
  <div class="vin-card">
    <div class="vin-card__body" style="display: grid; gap: 8px; padding-bottom: 4px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <p class="vin-small" style="margin: 0; color: var(--vin-muted)">Active users</p>
        <span class="vin-badge vin-badge--success">+4.3%</span>
      </div>
      <p style="margin: 0; font-size: 30px; font-weight: var(--vin-title-weight); line-height: 1.1">8,940</p>
      <p class="vin-small" style="margin: 0; color: var(--vin-muted)">In the last 30 days</p>
    </div>
  </div>
  <div class="vin-card">
    <div class="vin-card__body" style="display: grid; gap: 8px; padding-bottom: 4px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <p class="vin-small" style="margin: 0; color: var(--vin-muted)">Churn</p>
        <span class="vin-badge vin-badge--danger">+0.4%</span>
      </div>
      <p style="margin: 0; font-size: 30px; font-weight: var(--vin-title-weight); line-height: 1.1">2.1%</p>
      <p class="vin-small" style="margin: 0; color: var(--vin-muted)">Target is under 2%</p>
    </div>
  </div>
  <div class="vin-card">
    <div class="vin-card__body" style="display: grid; gap: 8px; padding-bottom: 4px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <p class="vin-small" style="margin: 0; color: var(--vin-muted)">Storage used</p>
        <span class="vin-badge">72%</span>
      </div>
      <p style="margin: 0; font-size: 30px; font-weight: var(--vin-title-weight); line-height: 1.1">72 GB</p>
      <div class="vin-progress" role="progressbar" aria-label="Storage used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72" style="--vin-value: 72%"></div>
    </div>
  </div>
</section>
